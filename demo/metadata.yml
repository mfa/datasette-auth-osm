---
title: OSM Auth Demo
description: |
  Demo login with OpenStreetmap. Sign in with top right navbar.
plugins:
  datasette-auth-osm:
    client_id:
      "$env": OSM_CLIENT_ID
    client_secret:
      "$env": OSM_CLIENT_SECRET
  datasette-block-robots:
    literal: |-
      User-agent: *
      Disallow: /
databases:
  private:
    allow:
      osm_id: "*"
