# fly.toml app configuration file generated for datasette-auth-osm-demo on 2025-08-08T15:47:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'datasette-auth-osm-demo'
primary_region = 'fra'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  builtin = 'python'

  [build.settings]
    pythonbase = '3.13-slim-bookworm'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = 256
